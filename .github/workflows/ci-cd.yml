name: CI and EC2 deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend
      - run: pytest -q
        env:
          PYTHONPATH: backend
      - run: docker build -t skillsync-backend ./backend
      - run: docker build -t skillsync-frontend ./frontend
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.EC2_HOST != ''
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment files
        run: tar --exclude=.git --exclude=.env --exclude=backend/.env --exclude='**/venv' -czf skillsync.tar.gz .
      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/skillsync.pem
          chmod 600 ~/.ssh/skillsync.pem
          ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy and start application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          scp -i ~/.ssh/skillsync.pem skillsync.tar.gz ubuntu@"${{ vars.EC2_HOST }}":/tmp/skillsync.tar.gz
          ssh -i ~/.ssh/skillsync.pem ubuntu@"${{ vars.EC2_HOST }}" 'mkdir -p /opt/skillsync && tar -xzf /tmp/skillsync.tar.gz -C /opt/skillsync && rm /tmp/skillsync.tar.gz'
          printf 'POSTGRES_PASSWORD=%s\nGEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-2.5-flash-lite\nCORS_ORIGINS=*\n' "$POSTGRES_PASSWORD" "$GEMINI_API_KEY" | ssh -i ~/.ssh/skillsync.pem ubuntu@"${{ vars.EC2_HOST }}" 'cat > /opt/skillsync/.env && chmod 600 /opt/skillsync/.env'
          ssh -i ~/.ssh/skillsync.pem ubuntu@"${{ vars.EC2_HOST }}" 'cd /opt/skillsync && docker compose up -d --build --remove-orphans'
