<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Skill Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader" id="pageLoader" aria-hidden="true">
    <div class="loader-panel">
        <div class="loader-orb"></div>
        <p id="loaderText">Processing your request...</p>
    </div>
</div>

<div class="container">
    <h1>AI Skill Gap Analyzer</h1>
    <p class="page-subtitle">Upload your resume, review extracted skills, and generate a focused roadmap for your next role.</p>

    <!-- Upload Resume -->
    <div class="card">
        <input type="file" id="resumeFile">
        <button onclick="uploadResume()">Upload & Extract Skills</button>
    </div>

    <!-- Extracted Skills Display -->
    <div class="card">
        <h3>Extracted Skills</h3>
        <p id="extractedSkills">No skills extracted yet</p>
    </div>

    <!-- Manual Skills (AUTO FILLED) -->
    <div class="card">
        <h3>Your Skills</h3>
        <input type="text" id="skills" placeholder="Skills will appear here">
    </div>

    <!-- Role Input -->
    <div class="card">
        <h3>Target Role</h3>
        <input type="text" id="role" placeholder="Enter role">
        <button onclick="analyzeSkills()">Generate Roadmap</button>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
