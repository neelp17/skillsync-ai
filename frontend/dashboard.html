<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader visible" id="pageLoader" aria-hidden="false">
    <div class="loader-panel">
        <div class="loader-orb"></div>
        <p id="loaderText">Preparing your analysis...</p>
    </div>
</div>

<div class="container">
    <h1>Analysis Result</h1>
    <p class="page-subtitle">Your extracted insights, missing skills, and roadmap are shown below in the same flow with a cleaner, more readable presentation.</p>

    <div class="card notice-card" id="noticeCard" style="display:none;">
        <p id="noticeText"></p>
    </div>

    <div class="card"><h3 id="analysisRole"></h3><p><strong>Skills:</strong> <span id="analysisSkills"></span></p><pre id="result"></pre><button id="editAnalysis">Update</button></div>
    <div class="card"><h3>Analysis history</h3><div id="historyList"></div></div>

    <a href="index.html">Back</a>
</div>

<script src="config.js"></script>
<script src="js/app.js"></script>

</body>
</html>
